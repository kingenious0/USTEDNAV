<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Reynolds Okai Building (ROB) — Indoor Floor Navigator | USTED NAV</title>
  <meta name="description" content="Interactive indoor floor plan and turn-by-turn room navigation for Reynolds Okai Building (ROB), AAMUSTED Kumasi. Powered by CampusOS.">
  <meta name="author" content="KINGENIOUS">
  <meta name="theme-color" content="#33449b">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Fonts & Icons (100% Matching map.html) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Indoor Stylesheet -->
  <link rel="stylesheet" href="indoor/indoor-viewer.css?v=2.0.0">
</head>
<body>

  <div class="indoor-app">

    <!-- ─── TOP BAR (Google Maps Pill Search Style - 100% Matching map.html) ─── -->
    <div class="top-bar" id="topBar">
      <div class="search-bar">
        <a href="map.html" class="search-back-btn" title="Back to Outdoor Campus Map" aria-label="Back to Campus Map">
          <i class="fas fa-arrow-left"></i>
        </a>
        <input type="text" id="indoorSearchInput" placeholder="Search rooms, offices, washrooms in ROB..." autocomplete="off" spellcheck="false">
        <div class="search-action-btns">
          <button class="search-clear-btn" id="searchClearBtn" title="Clear Search" aria-label="Clear">
            <i class="fas fa-xmark"></i>
          </button>
          <button class="voice-toggle-btn" id="btnVoiceToggle" title="Toggle Voice Guidance" aria-label="Toggle Voice">
            <i class="fas fa-volume-high" id="voiceToggleIcon"></i>
          </button>
          <button class="search-icon-btn" id="searchSearchBtn" aria-label="Search">
            <i class="fas fa-magnifying-glass"></i>
          </button>
        </div>

        <!-- Live Autocomplete Dropdown matching outdoor search results -->
        <div class="search-results autocomplete-dropdown" id="autocompleteDropdown"></div>
      </div>
    </div>

    <!-- ─── TOP DISCOVERY BAR: QUICK CATEGORY RAIL ─────────────── -->
    <div class="category-rail" id="categoryRail">
      <div class="category-chips-scroll" id="categoryChips">
        <button class="cat-chip active" data-category="all">
          <i class="fas fa-layer-group"></i>
          <span>All</span>
        </button>
        <button class="cat-chip" data-category="washroom">
          <i class="fas fa-restroom" style="color: #10b981;"></i>
          <span>Washrooms</span>
        </button>
        <button class="cat-chip" data-category="entrance">
          <i class="fas fa-door-open" style="color: #f59e0b;"></i>
          <span>Entrances</span>
        </button>
        <button class="cat-chip" data-category="faculty">
          <i class="fas fa-briefcase" style="color: #6366f1;"></i>
          <span>Offices</span>
        </button>
        <button class="cat-chip" data-category="lecture">
          <i class="fas fa-chalkboard-user" style="color: #0ea5e9;"></i>
          <span>Lecture Rooms</span>
        </button>
      </div>

      <!-- Quick Origin Indicator Pill -->
      <div class="origin-pill-dock" id="originChip" title="Click to choose a different starting point">
        <i class="fas fa-location-dot" style="color: #10b981;"></i>
        <span id="originChipLabel">From: Main Entrance</span>
        <i class="fas fa-chevron-down" style="font-size: 9px; opacity: 0.6;"></i>
      </div>
    </div>

    <!-- ─── LIVE ACTIVE MANEUVER HUD CARD (Walk-With-Me Turn Guidance) ─── -->
    <div class="active-maneuver-card" id="activeManeuverCard" aria-live="polite">
      <div class="maneuver-icon-wrap" id="maneuverIconWrap">
        <i class="fas fa-person-walking" id="maneuverIcon"></i>
      </div>
      <div class="maneuver-details">
        <div class="maneuver-primary" id="maneuverPrimary">Walk along corridor</div>
        <div class="maneuver-secondary" id="maneuverSecondary">Toward destination</div>
        <div class="maneuver-progress-bar">
          <div class="maneuver-progress-fill" id="maneuverProgressFill" style="width: 0%;"></div>
        </div>
      </div>
      <div class="maneuver-actions">
        <button class="btn-step-simulate" id="btnStepSimulate" title="Take a Step (0.7m)" aria-label="Take a step">
          <i class="fas fa-shoe-prints"></i>
          <span>Step</span>
        </button>
        <button class="btn-walk-toggle" id="btnWalkToggle" title="Auto-Walk Simulation" aria-label="Toggle Auto-Walk">
          <i class="fas fa-play" id="walkToggleIcon"></i>
        </button>
      </div>
    </div>

    <!-- ─── FLOATING ACTION BUTTONS (Right Rail HUD) ────────────── -->
    <div class="fabs" id="fabs">
      <!-- Floor Level FAB with 3D Badge -->
      <button class="fab fab-dim-toggle active-floor" id="btnFloorToggle" title="Reynolds Okai Building - Ground Floor (GF) Active">
        <span class="floor-label">GF</span>
        <span class="floor-badge">ROB</span>
      </button>

      <!-- Live Compass with Degree Readout -->
      <button class="fab fab-compass" id="compassFab" title="Live Heading & Orientation">
        <i class="fas fa-compass" id="compassIcon"></i>
        <span class="compass-readout" id="compassReadout">0° N</span>
      </button>

      <!-- Recenter View FAB -->
      <button class="fab" id="recenterBtn" title="Re-center on Your Location / Plan" aria-label="Recenter Map">
        <i class="fas fa-location-crosshairs"></i>
      </button>

      <!-- Zoom Control Pill -->
      <div class="zoom-ctrl">
        <button class="zoom-btn" id="zoomInBtn" title="Zoom In" aria-label="Zoom In">
          <i class="fas fa-plus"></i>
        </button>
        <button class="zoom-btn" id="zoomOutBtn" title="Zoom Out" aria-label="Zoom Out">
          <i class="fas fa-minus"></i>
        </button>
      </div>

      <!-- Fullscreen FAB -->
      <button class="fab" id="fullscreenBtn" onclick="toggleFullscreen()" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <i class="fas fa-expand"></i>
      </button>
    </div>

    <!-- ─── INTERACTIVE MAP VIEWPORT ──────────────────────────── -->
    <main id="mapViewport" class="map-viewport">
      <div id="mapSvgContainer" class="map-svg-container">
        <svg id="indoorSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </main>

    <!-- ─── DISCOVERY MODE: ROOM SELECTION DETAIL SHEET ────────── -->
    <div class="sheet" id="detailSheet">
      <div class="sheet-handle" id="sheetHandle"></div>
      <div class="sheet-content">
        <div class="sheet-header">
          <div class="sheet-left">
            <div id="sheetIcon" class="sheet-icon-box">
              <i class="fas fa-door-open"></i>
            </div>
            <div class="sheet-title-box">
              <h3 id="sheetTitle">Room 24 Entrance 1</h3>
              <p id="sheetSubtitle">Lecture Hall • Ground Floor</p>
            </div>
          </div>
          <button id="sheetCloseBtn" class="sheet-close-btn" title="Close Panel" aria-label="Close">
            <i class="fas fa-xmark"></i>
          </button>
        </div>

        <!-- Route Planner Strip -->
        <div class="route-planner-strip" id="routePlannerStrip">
          <div class="planner-row planner-origin-row" id="btnChangeOrigin" title="Tap to change origin">
            <div class="planner-dot origin-dot"></div>
            <div class="planner-label-wrap">
              <span class="planner-sub">STARTING FROM</span>
              <span class="planner-name" id="plannerOriginName">Main Entrance</span>
            </div>
            <i class="fas fa-pen-to-square planner-edit-icon"></i>
          </div>
          <div class="planner-divider-line"></div>
          <div class="planner-row planner-dest-row">
            <div class="planner-dot dest-dot"></div>
            <div class="planner-label-wrap">
              <span class="planner-sub">DESTINATION</span>
              <span class="planner-name" id="plannerDestName">Select room</span>
            </div>
          </div>
        </div>

        <!-- Walking Metrics Strip -->
        <div class="route-metrics" id="routeMetricsStrip">
          <div class="metric-item">
            <i class="fas fa-person-walking"></i>
            <span id="metricDistance">0 m</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <i class="fas fa-stopwatch"></i>
            <span id="metricTime">0s walk</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item">
            <i class="fas fa-route"></i>
            <span>Fastest Route</span>
          </div>
        </div>

        <!-- Primary Actions -->
        <div class="sheet-actions dual-nav-actions">
          <button class="btn-sheet-origin" id="btnSetAsOrigin" title="Set this location as your starting point">
            <i class="fas fa-location-crosshairs"></i>
            <span>Set As Start</span>
          </button>
          <button class="btn-sheet-dest" id="btnSetAsDest" title="Start Live Walk Guidance">
            <i class="fas fa-diamond-turn-right"></i>
            <span id="btnDestText">Start Live Walk</span>
          </button>
        </div>

        <!-- Secondary Action Buttons -->
        <div class="sheet-actions-secondary">
          <button class="btn-secondary-link" onclick="copyShareLink()">
            <i class="fas fa-share-nodes"></i> Share Link
          </button>
          <button class="btn-secondary-link" onclick="window.indoorNav.fitToScreen(true)">
            <i class="fas fa-expand"></i> Full Plan
          </button>
        </div>

        <!-- Turn-by-Turn Checklist Drawer -->
        <div class="turn-steps-container" id="turnStepsContainer">
          <div class="turn-steps-header">
            <span>Route Steps</span>
            <span id="turnStepsCount" class="badge-steps-count">0 legs</span>
          </div>
          <div id="turnStepsList" class="turn-steps-list"></div>
        </div>
      </div>
    </div>

    <!-- ─── ACTIVE NAVIGATION WALK HUD DOCK (Apple Maps Bottom Dock) ─── -->
    <div class="nav-walk-dock" id="navWalkDock" aria-live="polite">
      <div class="walk-dock-handle" id="walkDockHandle"></div>
      <div class="walk-dock-bar">
        <div class="dock-left-metrics" id="dockMetricsTrigger">
          <div class="dock-eta-row">
            <span class="dock-primary-dist" id="dockRemainingDist">0 m</span>
            <span class="dock-eta-dot">•</span>
            <span class="dock-primary-time" id="dockRemainingTime">~0s walk</span>
          </div>
          <div class="dock-secondary-dest" id="dockDestLabel">Walk in progress</div>
        </div>
        <div class="dock-right-actions">
          <button class="dock-action-btn" id="dockVoiceBtn" title="Toggle Voice Prompts" aria-label="Toggle Voice">
            <i class="fas fa-volume-high" id="dockVoiceIcon"></i>
          </button>
          <button class="btn-dock-stop" id="btnStopNav" title="End Navigation" aria-label="Stop Navigation">
            <i class="fas fa-xmark"></i>
            <span>Exit</span>
          </button>
        </div>
      </div>
      <!-- Expandable Steps Sheet when walking -->
      <div class="walk-dock-expanded" id="walkDockExpanded">
        <div class="dock-steps-title">Turn-by-Turn Guidance</div>
        <div id="dockTurnStepsList" class="dock-turn-steps-list"></div>
      </div>
    </div>

  </div>

  <!-- Fullscreen & Share Utilities -->
  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-compress"></i>';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
        document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-expand"></i>';
      }
    }

    function copyShareLink() {
      if (!window.indoorNav || !window.indoorNav.destinationId) return;
      const url = `${window.location.origin}${window.location.pathname}?floor=rob_ground&to=${window.indoorNav.destinationId}&from=${window.indoorNav.originNodeId}`;
      navigator.clipboard.writeText(url).then(() => {
        alert('Room navigation link copied to clipboard!');
      }).catch(() => {
        prompt('Copy room link:', url);
      });
    }
  </script>

  <!-- Core Indoor Navigation Engine V2.0 -->
  <script src="indoor/indoor-viewer.js?v=2.0.0"></script>
</body>
</html>
